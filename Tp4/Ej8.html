<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>

    <form>

        <label>Nombre:</label><br>
        <input type="text" name="nombre"><br><br>

        <label>Es mayor de edad?</label><br>
        <input type="radio" name="mayor" value="si" checked> Sí
        <input type="radio" name="mayor" value="no"> No
        <br><br>

        <label>Teléfono:</label><br>
        <input type="text" name="telefono" value="0299-"><br><br>

        <label>Comentarios:</label><br>
        <textarea name="comentarios" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Enviar">

    </form>

</body>
</html>
