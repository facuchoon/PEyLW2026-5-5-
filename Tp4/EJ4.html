<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de colores</title>
</head>
<body>

    <form>
        <h3>Seleccione uno o varios colores:</h3>

        <input type="checkbox" name="color" value="Verde"> Verde <br>
        <input type="checkbox" name="color" value="Azul"> Azul <br>
        <input type="checkbox" name="color" value="Amarillo"> Amarillo <br>
        <input type="checkbox" name="color" value="Blanco"> Blanco <br>
        <input type="checkbox" name="color" value="Negro"> Negro <br>
        <input type="checkbox" name="color" value="Naranja"> Naranja <br>
        <input type="checkbox" name="color" value="Violeta"> Violeta <br>
    </form>

</body>
</html>
