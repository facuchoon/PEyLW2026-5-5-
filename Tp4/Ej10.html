<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Visitas</title>
</head>
<body>

<form>

    <label>Nombre:</label><br>
    <input type="text" name="nombre"><br><br>

    <label>Mail:</label><br>
    <input type="email" name="mail"><br><br>

    <label>País de origen:</label><br>
    <select name="pais">
        <option selected>Seleccione país</option>
        <option>Argentina</option>
        <option>Chile</option>
        <option>Uruguay</option>
        <option>Brasil</option>
    </select><br><br>

    <label>Valoración del sitio:</label><br>
    <input type="radio" name="valoracion" value="Malo"> Malo<br>
    <input type="radio" name="valoracion" value="Regular"> Regular<br>
    <input type="radio" name="valoracion" value="Bueno" checked> Bueno<br>
    <input type="radio" name="valoracion" value="Muy Bueno"> Muy Bueno<br>
    <input type="radio" name="valoracion" value="Excelente"> Excelente<br><br>

    <label>Comentarios:</label><br>
    <textarea name="comentarios" rows="5" cols="30"></textarea><br><br>

    <input type="submit" value="Enviar">

</form>

</body>
</html>
