<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tabla Vertical</title>
</head>
<body>
    
<TABLE border="1" width="500" height="200"> 
 <Caption> Tabla vertical</Caption>   
<tr> 
    <th valign="top"> Columna alineada verticalmente arriba </th>
    <th valign="middle"> Columna alineada verticalmente al medio </th> 
    <th valign="bottom"> Columna alineada verticalmente abajo </th>
</tr>

<tr>
    <td valign="top"> Contenido fila 1 col 1 </td>
    <td valign="middle"> Contenido fila 2 col 2 </td>   
    <td valign="bottom"> Contenido fila 3 col 3 </td>
</tr>
<tr>
    <td valign="top"> Contenido fila 2 col 1 </td>
    <td valign="middle"> Contenido fila 2 col 2 </td>
    <td valign="bottom"> Contenido fila 3 col 3 </td>
</tr>

</body>
</html>
